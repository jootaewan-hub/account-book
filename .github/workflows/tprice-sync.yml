name: 참가격 매장 가격 받기

# 매일 07:20(한국 시간)과 수동 실행. Supabase Edge Function tprice-sync를 부른다.
# 참가격 조사는 격주 금요일이고 값은 며칠 뒤 들어오므로(10-09 조사값이 10-15 입력, docs/grocery/data-sources.md 2절) 매일 최근 금요일 5개를 확인한다.
# 호출 비밀번호는 없다: 함수가 20시간에 한 번만 실제로 받는다(이미 받았으면 200 {"status":"skipped"}, 30분 안 재시도는 429).
# 207(일부만 받음)이면 31분 뒤 한 번 더 부른다(잠금 30분). 키는 Supabase 함수 비밀값에만 있고 여기에 두지 않는다.
on:
  schedule:
    - cron: '20 22 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: tprice-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 참가격 받아 저장
        run: |
          call() {
            code=$(curl -sS -m 170 -o body.json -w '%{http_code}' -X POST \
              "https://kifdfpbwiebfgvdumqjf.supabase.co/functions/v1/tprice-sync")
            cat body.json
            echo
          }
          call
          if [ "$code" = "207" ]; then
            echo "일부만 받음: 31분 뒤 다시 부른다"
            sleep 1860
            call
          fi
          if [ "$code" != "200" ]; then
            echo "참가격 받기 실패: HTTP $code"
            exit 1
          fi
