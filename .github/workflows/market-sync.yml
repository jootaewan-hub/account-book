name: 농수산물 시세 받기

# 매일 07:10(한국 시간)과 수동 실행. Supabase Edge Function market-sync를 부른다.
# 공공데이터포털 15156057의 전날 조사값은 그날 밤에 등록된다(10-16 값이 한국 시간 10-17 00:07 등록, docs/grocery/data-sources.md 3-1).
# 호출 비밀번호는 없다: 함수가 20시간에 한 번만 실제로 받는다(이미 받았으면 200 {"status":"skipped"}, 30분 안 재시도는 429).
# 207(일부만 받음)이면 31분 뒤 한 번 더 부른다(잠금 30분). 키는 Supabase 함수 비밀값에만 있고 여기에 두지 않는다.
on:
  schedule:
    - cron: '10 22 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: market-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 시세 받아 저장
        run: |
          call() {
            code=$(curl -sS -m 170 -o body.json -w '%{http_code}' -X POST \
              "https://kifdfpbwiebfgvdumqjf.supabase.co/functions/v1/market-sync")
            cat body.json
            echo
          }
          call
          if [ "$code" = "207" ]; then
            echo "일부만 받음: 31분 뒤 다시 부른다"
            sleep 1860
            call
          fi
          if [ "$code" != "200" ]; then
            echo "시세 받기 실패: HTTP $code"
            exit 1
          fi
