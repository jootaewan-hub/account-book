# 의존성 갱신 PR을 매주 한 번 모아서 올린다. 병합은 사람이 CI(ci.yml) 결과를 보고 한다.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    groups:
      dev-tools:
        dependency-type: development
      runtime:
        dependency-type: production
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
